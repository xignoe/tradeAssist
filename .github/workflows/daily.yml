name: Daily targets

# Runs on GitHub's machines, not yours — nothing to leave switched on.
# 23:30 UTC = 7:30pm EDT / 6:30pm EST, comfortably after the US close, on
# weekdays only (markets are shut at the weekend, so there is no new data).
on:
  schedule:
    # GitHub explicitly does not guarantee scheduled runs: they can be delayed
    # or dropped entirely during peak load. A dropped run costs a day that can
    # never be re-fetched, so we take two shots an hour apart. The run is
    # idempotent per date, so the second simply refreshes the first.
    # Both land on the same UTC date and after the US close year-round
    # (22:30 UTC = 6:30pm EDT / 5:30pm EST).
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:        # lets you (or I) trigger a run by hand

permissions:
  contents: write           # needed to commit the day's snapshot back

concurrency:
  group: daily-targets      # never let two runs race on the same commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet httpx

      # Health problems exit non-zero, but the day's data is already written by
      # then. Let the step "fail" softly so the commit below still runs, then
      # fail the job at the end — that way the data is kept AND GitHub emails
      # you about the failed run instead of it degrading silently.
      - name: Fetch targets
        id: fetch
        continue-on-error: true
        run: python qqq_targets.py

      - name: Publish report for GitHub Pages
        run: |
          mkdir -p docs
          cp output/report.html docs/index.html

      - name: Commit the day's snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily targets snapshot $(date -u +%Y-%m-%d)"
            # Another run may have landed while this one was fetching.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Fail the run if the data looked wrong
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Data health check failed — see the 'Fetch targets' step."
          echo "The day's data was still saved and committed."
          exit 1

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/*.csv
            output/report.html
          retention-days: 14
          if-no-files-found: warn
